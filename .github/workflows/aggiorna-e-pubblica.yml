name: Aggiorna notizie e pubblica il sito

on:
  schedule:
    # Ogni 3 ore dalle 6 alle 21 circa (orari UTC: 5, 8, 11, 14, 17, 20).
    - cron: "17 5-20/3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Raccogli le notizie
        # Se le fonti non rispondono si pubblica comunque l'archivio esistente.
        continue-on-error: true
        run: python scripts/aggiorna.py

      - name: Salva l'archivio aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archivio.json
          if git diff --cached --quiet; then
            echo "Nessuna novità."
          else
            git commit -m "Aggiorna le notizie"
            git push
          fi

      - name: Configura GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Genera il sito
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: python scripts/build.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pubblica:
    needs: genera
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
